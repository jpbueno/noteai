name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "37 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks git history scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare scan report directory
        run: mkdir -p reports

      - name: Validate secret scan contract
        run: node --test scripts/secret-scanning-workflow.test.mjs

      - name: Run Gitleaks
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.0
        with:
          args: >-
            git
            --config=.gitleaks.toml
            --baseline-path .gitleaks.baseline.json
            --report-format sarif
            --report-path reports/gitleaks.sarif
            --redact
            --verbose
            .

      - name: Upload Gitleaks SARIF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: reports/gitleaks.sarif
          if-no-files-found: ignore
