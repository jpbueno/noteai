name: Web Deploy to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/web-deploy-cloudflare.yml"
      - "web/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy production Worker
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    timeout-minutes: 20
    environment:
      name: production
      url: https://noteai-web.noteai-jp.workers.dev
    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Cloudflare Worker bundle
        run: npm run build:cf

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy --env="" --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke check production health endpoint
        run: |
          curl --fail --silent --show-error "https://noteai-web.noteai-jp.workers.dev/api/health" --output /tmp/noteai-health.json
          node -e '
            const fs = require("node:fs");
            const payload = JSON.parse(fs.readFileSync("/tmp/noteai-health.json", "utf8"));
            if (payload.ok !== true || payload.service !== "noteai-web") {
              console.error("Unexpected health payload:", payload);
              process.exit(1);
            }
          '
