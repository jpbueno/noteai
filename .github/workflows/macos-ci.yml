name: macOS CI

on:
  pull_request:
    paths:
      - ".github/workflows/macos-ci.yml"
      - "NoteAI/**"
      - "NoteAITests/**"
      - "NoteAI.xcodeproj/**"
      - "Package.swift"
      - "Package.resolved"
      - "project.yml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/macos-ci.yml"
      - "NoteAI/**"
      - "NoteAITests/**"
      - "NoteAI.xcodeproj/**"
      - "Package.swift"
      - "Package.resolved"
      - "project.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Xcode build and test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project NoteAI.xcodeproj -scheme NoteAI

      - name: Build NoteAI
        run: |
          xcodebuild \
            -project NoteAI.xcodeproj \
            -scheme NoteAI \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run NoteAI tests
        run: |
          xcodebuild \
            -project NoteAI.xcodeproj \
            -scheme NoteAI \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            test
