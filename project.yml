name: NoteAI
options:
  bundleIdPrefix: com.noteai
  deploymentTarget:
    macOS: "14.2"
  xcodeVersion: "16.0"

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    from: "0.9.0"
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: "6.24.0"

targets:
  NoteAI:
    type: application
    platform: macOS
    sources:
      - path: NoteAI
        excludes:
          - "**/*.entitlements"
    settings:
      base:
        INFOPLIST_FILE: NoteAI/Info.plist
        CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: BNLE7G9V59
        PRODUCT_BUNDLE_IDENTIFIER: com.noteai.app
        NOTEAI_URL_SCHEME: noteai
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        MACOSX_DEPLOYMENT_TARGET: "14.2"
        SWIFT_VERSION: "5.9"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    dependencies:
      - package: WhisperKit
      - package: GRDB
        product: GRDB
    entitlements:
      path: NoteAI/NoteAI.entitlements

  NoteAIv6:
    type: application
    platform: macOS
    sources:
      - path: NoteAI
        excludes:
          - "**/*.entitlements"
    settings:
      base:
        INFOPLIST_FILE: NoteAI/Info.plist
        CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: BNLE7G9V59
        PRODUCT_NAME: "NoteAI v6"
        PRODUCT_BUNDLE_IDENTIFIER: com.noteai.app.v6
        NOTEAI_URL_SCHEME: noteai-v6
        MARKETING_VERSION: "6.0"
        CURRENT_PROJECT_VERSION: "1"
        MACOSX_DEPLOYMENT_TARGET: "14.2"
        SWIFT_VERSION: "5.9"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    dependencies:
      - package: WhisperKit
      - package: GRDB
        product: GRDB
    entitlements:
      path: NoteAI/NoteAI.entitlements

  NoteAITests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - NoteAITests
    dependencies:
      - target: NoteAI
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"

schemes:
  NoteAI:
    build:
      targets:
        NoteAI: all
        NoteAITests: [test]
    test:
      targets:
        - NoteAITests

  NoteAIv6:
    build:
      targets:
        NoteAIv6: all
