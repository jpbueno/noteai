name: macOS CI

on:
  pull_request:
    paths:
      - ".github/workflows/macos-ci.yml"
      - "NoteAI/**"
      - "NoteAITests/**"
      - "NoteAI.xcodeproj/**"
      - "Package.swift"
      - "Package.resolved"
      - "project.yml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/macos-ci.yml"
      - "NoteAI/**"
      - "NoteAITests/**"
      - "NoteAI.xcodeproj/**"
      - "Package.swift"
      - "Package.resolved"
      - "project.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-test:
    name: Swift package tests
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Run Swift package tests
        run: swift test
